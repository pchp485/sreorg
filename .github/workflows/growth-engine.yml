name: Growth engine

# The acquisition loop. Drafts new page content weekly and opens a PR.
# It never publishes directly: this is tax content, and a wrong number costs
# a reader money and the site its rankings. Review takes about two minutes.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Draft new content
        run: npm run growth
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify the site still builds with the new content
        run: npm run typecheck && npm test

      - name: Open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/content/generated/; then
            echo "No new content this cycle."
            exit 0
          fi
          BRANCH="growth/$(date +%Y-%m-%d)"
          git config user.name "growth-engine"
          git config user.email "growth-engine@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/generated/
          git commit -m "content: weekly FAQ batch"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Weekly content batch $(date +%Y-%m-%d)" \
            --body "Drafted by the growth engine. **Check every number against the law before merging** — SAC codes, GST rates, TDS sections and thresholds." \
            --base main
