[project]
name = "parentai-backend"
version = "0.1.0"
description = "ParentAI — secure voice assistant with speaker authentication"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
# Cloud / heavier providers — install only what a deployment enables.
openai = ["openai>=1.30"]
whisper = ["openai-whisper>=20231117"]
porcupine = ["pvporcupine>=3.0"]
speaker = ["resemblyzer>=0.1.3", "numpy>=1.26"]
smarthome = ["python-kasa>=0.7", "paho-mqtt>=2.0", "boto3>=1.34"]
redis = ["redis>=5.0"]
db = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20", "asyncpg>=0.29", "alembic>=1.13"]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
